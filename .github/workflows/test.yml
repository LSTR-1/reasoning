name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm run test:unit -- --reporter=json --outputFile=test-report.json
      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-report-unit-${{ github.run_id }}
          path: test-report.json

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm run test:integration -- --reporter=json --outputFile=test-report.json
      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-report-integration-${{ github.run_id }}
          path: test-report.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run e2e tests
        run: pnpm run test:e2e -- --reporter=json --outputFile=test-report.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-report-e2e-${{ github.run_id }}
          path: test-report.json

  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run deprecation checks
        id: cleanup
        run: |
          pnpm run test:cleanup 2>&1 | tee cleanup-output.txt
          while IFS= read -r line; do
            if echo "$line" | grep -qi "warn"; then
              echo "::warning::$line"
            fi
          done < cleanup-output.txt